<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alinhamento vertical</title>
    <style>
        section{
            background-image: url(Imagens/target001.png);
            background-size: 100% 100%;

            position: relative;
            height: 96vh;
            background-color: aqua;
            padding: 10px;
        }
        article{
            background-image: url(Imagens/target001.png);
            background-size: 100% 100%;

            height: 200px;
            width: 400px;
            background-color: blue;
            position: absolute;
            left: 50%;
            top: 50%;
        }
    </style>
</head>
<body>
    <section>
        <article>

        </article>
    </section>
</body>
</html>
