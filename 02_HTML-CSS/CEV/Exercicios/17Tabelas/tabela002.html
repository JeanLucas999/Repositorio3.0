<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        table{
            width: 500px;
            border-collapse: collapse;
        }

        td, th{
            border: 1px solid black;
            padding: 10px;
        }

        thead, tfoot{
            background-color: antiquewhite;
        }

        .num{
            text-align: right;
        }

        tbody > tr:nth-child(2n){
            background-color: rgb(240, 184, 100);
        }

        caption{
            vertical-align: middle;
            background-color: black;
            padding: 10px;
            color: white;
        }
    </style>
</head>

<body>

    <h1>Uso de tabelas grandes</h1>
    <table>
        <caption>
            POPULACOES DAS UNIDADES FEDERATIVAS
        </caption>

        <thead>
            <tr>
                <th scope="col">Estado</th>
                <th scope="col" style="width: 50px;">População</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>SP</td>
                <td class="num">45 919 049</td>
            </tr>

            <tr>
                <td>MG</td>
                <td class="num">21 460 311</td>
            </tr>

            <tr>
                <td>RJ</td>
                <td class="num">17 225 410</td>
            </tr>
            
        </tbody>
        <tfoot>
            <tr>
                <th scope="row">Total de Habitantes</th>
                <td class="num">0000</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
