name: notas
description: Caderno digital pessoal com caneta, formas geométricas e gestos.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.4
  window_manager: ^0.4.3
  pdf: ^3.11.1
  file_picker: ^8.1.2
  desktop_drop: ^0.4.4
  pasteboard: ^0.2.0
  pdfrx: ^2.0.0
  http: ^1.2.0
  url_launcher: ^6.3.0
  crypto: ^3.0.3
  vector_math: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#2B3A9E"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 256
